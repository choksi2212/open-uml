name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check + tests
        run: npm test

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    needs: [lint-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/*.exe
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    needs: [lint-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # v1.0.1 and earlier packed the Windows JRE (committed at
      # app/plantuml/jre) into the macOS DMG, so the app could never run on
      # macOS and Gatekeeper reported it as damaged. The mac build now ships
      # a real macOS JRE fetched at build time into app/plantuml/jre-mac,
      # which the main process picks per-OS (jre-win / jre-mac).
      - name: Fetch macOS JRE (Temurin 25, x64+aarch64 universal)
        run: |
          set -eu
          mkdir -p app/plantuml/jre-mac
          # Temurin publishes separate x64 and aarch64 tarballs; the runner is
          # arm64, and the DMG it produces runs on this host. For a universal
          # app, merge both JDK layouts over one tree (bin/java is a launcher
          # that picks the right libjvm at runtime when both lib dirs exist
          # only under separate Contents/Home trees - so instead we ship the
          # runner-arch build; GitHub's macos-latest is arm64).
          curl -sSL -o /tmp/jre-mac.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/25/ga/mac/aarch64/jre/hotspot/normal/eclipse"
          tar -xzf /tmp/jre-mac.tar.gz -C /tmp
          JRE_DIR=$(ls -d /tmp/jdk*-jre/Contents/Home | head -n 1)
          # Copy the JRE tree so that app/plantuml/jre-mac/bin/java exists
          rsync -a "$JRE_DIR/" app/plantuml/jre-mac/
          chmod +x app/plantuml/jre-mac/bin/java
          app/plantuml/jre-mac/bin/java -version

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build macOS installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the DMG carries a macOS JRE, not a Windows one
        run: |
          set -eu
          DMG=$(ls build/*.dmg | head -n 1)
          hdiutil attach "$DMG" -mountpoint /Volumes/OpenUMLCheck -nobrowse -readonly
          APP="/Volumes/OpenUMLCheck/Open UML.app"
          JAVA="$APP/Contents/Resources/plantuml/jre-mac/bin/java"
          if [ ! -f "$JAVA" ]; then
            echo "::error::macOS JRE missing from the DMG"; hdiutil detach /Volumes/OpenUMLCheck; exit 1
          fi
          FILE_KIND=$(file -b "$JAVA")
          echo "java binary: $FILE_KIND"
          if ! echo "$FILE_KIND" | grep -q "Mach-O"; then
            echo "::error::DMG does not contain a Mach-O java binary - aborting the release"
            hdiutil detach /Volumes/OpenUMLCheck; exit 1
          fi
          hdiutil detach /Volumes/OpenUMLCheck

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: build/*.dmg
          retention-days: 30

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            VERSION="${{ steps.get_version.outputs.version }}"
            CHANGELOG=$(awk "/^## \\[$VERSION\\]/,/^## \\[/" CHANGELOG.md | sed '$d' || echo "✨ New release")
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog=✨ New release" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: ./artifacts/macos

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Open UML ${{ steps.get_version.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.changelog }}
            
            ## 📦 Downloads
            
            - 🪟 **Windows**: Download `OpenUML-Setup-${{ steps.get_version.outputs.version }}.exe` below
            - 🍎 **macOS**: Download `OpenUML-${{ steps.get_version.outputs.version }}.dmg` below
            
            ## 🚀 Installation
            
            ### Windows
            1. Download and run the `.exe` installer
            2. Follow the setup wizard
            3. Launch Open UML from the desktop shortcut
            
            ### macOS
            1. Download and open the `.dmg` file
            2. Drag Open UML to Applications
            3. Launch from Applications or Spotlight
            4. If macOS says the app is from an unidentified developer: right-click Open UML in Applications and choose **Open** (the app is ad-hoc signed; this is the normal unsigned-app flow)
          files: |
            artifacts/windows/*.exe
            artifacts/macos/*.dmg
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'alpha') }}
